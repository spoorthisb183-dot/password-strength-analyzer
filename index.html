<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            text-align: left;
        }

        .weak {
            color: red;
            font-weight: bold;
        }

        .medium {
            color: orange;
            font-weight: bold;
        }

        .strong {
            color: green;
            font-weight: bold;
        }

        ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 Password Strength Analyzer</h1>

    <p>Check how strong your password is</p>

    <input type="password" id="password"
           placeholder="Enter your password">

    <br>

    <button onclick="checkPassword()">
        Check Password
    </button>

    <div id="result"></div>

</div>

<script>

function checkPassword() {

    let password = document.getElementById("password").value;

    let score = 0;
    let suggestions = [];

    // Check length
    if (password.length >= 8) {
        score++;
    } else {
        suggestions.push("Use at least 8 characters.");
    }

    // Check lowercase
    if (/[a-z]/.test(password)) {
        score++;
    } else {
        suggestions.push("Add lowercase letters.");
    }

    // Check uppercase
    if (/[A-Z]/.test(password)) {
        score++;
    } else {
        suggestions.push("Add uppercase letters.");
    }

    // Check numbers
    if (/[0-9]/.test(password)) {
        score++;
    } else {
        suggestions.push("Add numbers.");
    }

    // Check special characters
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        score++;
    } else {
        suggestions.push("Add special characters.");
    }

    // Check repeated characters
    if (/(.)\1\1/.test(password)) {
        score--;
        suggestions.push(
            "Avoid repeating the same character many times."
        );
    }

    // Strength result
    let strength;
    let strengthClass;

    if (score <= 2) {
        strength = "WEAK";
        strengthClass = "weak";
    } 
    else if (score <= 4) {
        strength = "MEDIUM";
        strengthClass = "medium";
    } 
    else {
        strength = "STRONG";
        strengthClass = "strong";
    }

    let output = `
        <h2>Password Strength:
            <span class="${strengthClass}">
                ${strength}
            </span>
        </h2>

        <p><b>Score:</b> ${score} / 5</p>
    `;

    if (suggestions.length > 0) {

        output += "<h3>Suggestions:</h3><ul>";

        suggestions.forEach(function(suggestion) {
            output += "<li>" + suggestion + "</li>";
        });

        output += "</ul>";

    } else {

        output += `
            <p class="strong">
                ✅ Good job! Your password meets all
                the basic checks.
            </p>
        `;
    }

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
